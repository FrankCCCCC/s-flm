name: tiny
type: hyperbolic-dit
hidden_size: 512
cond_dim: 128
embed_dim: null   # manifold dim fed to the DiT; null = hidden_size (state consumed as-is), else lifted by a linear in_proj
hyla_dim: null    # random Laplacian features (HyLa) of the state fed to the DiT: total feature dim, a multiple of the number of product factors; null = feed the Poincaré coordinates
hyla_scale: 1.0   # std of the HyLa eigenvalue draw lambda ~ N(0, hyla_scale^2) (the paper's s)
hyla_radius_cap: null   # evaluate the HyLa map at min(s, cap) of the dimensionless radial s = rho/R (the features are ~0 past s ~ 6); null = no cap
hyla_concat_state: false   # feed the Poincaré coordinates next to the HyLa features (in_proj sees embed_dim + hyla_dim) instead of replacing them
hyla_normalize: true   # divide the features by sqrt(hyla_dim) (the paper's phi); false = unnormalized as in the reference code
sphere_degree: null   # hyperbolic-harmonic features of the state fed to the DiT (HarmonicFeatures, the "sphere" map): max degree L of f_l(s) Y_lm(u) per H^3 factor, (L+1)^2 features + the radial channels; null = off; exclusive with hyla_dim
sphere_radial_scales: [1, 2, 4, 8, 16, 32]   # radial channels tanh(s / c) per factor fed next to the harmonic features (s = rho/R, dimensionless)
sphere_mc_samples: null   # Monte-Carlo sphere features: mean of Y_lm(w) over this many fresh boundary angles w ~ P(z,.) per H^3 factor (the Poisson kernel as its own proposal, unit weights; exact gradient), every forward in train and eval; null = the closed-form f_l(s) Y_lm(u); needs sphere_degree; adds no checkpoint keys
length: 180
n_blocks: 8
n_heads: 8
dropout: 0.1
init: ngpt             # random: std=0.02, hyperbolic: std=0.3 ⇒ ‖e_v‖≈6.8 at init
init_std: null               # std for init=custom; ignored for other init modes
learn_temperature_scaling: False
eps: 1e-6
pretrained_ckpt_path: null
