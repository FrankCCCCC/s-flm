name: small
type: hyperbolic-dit
hidden_size: 768
cond_dim: 128
embed_dim: null   # manifold dim fed to the DiT; null = hidden_size (state consumed as-is), else lifted by a linear in_proj
random_feature_type: null   # input map of the state fed to the DiT: null = the Poincaré coordinates (the default), sphere = the hyperbolic-harmonic features (SphericalFeature, set by sphere_*); eval must match training
sphere_degree: 4   # sphere map only: max degree L of f_l(s) Y_lm(u) per H^3 factor, (L+1)^2 features + the radial channels; 4 is the best tested (sudoku 64.6 +- 2.1 with the naive readout at LR 5e-4; L = 2 ties at 63.0 +- 1.2; higher L does not help)
sphere_radial_scales: [1, 2, 4, 8, 16, 32]   # radial channels tanh(s / c) per factor fed next to the harmonic features (s = rho/R, dimensionless); this ladder is the best tested (a single channel [2] scored 5 pt lower on sudoku)
sphere_radial_type: exp_decay   # radial profile of the harmonic features: exp_decay = the H^3 Laplace solution f_l(s) -> 1 at the boundary, the only one (SphericalFeature.radial notes why a flat f_l = 1 was removed); adds no checkpoint keys, so eval must match training
sphere_mc_samples: null   # Monte-Carlo sphere features: mean of Y_lm(w) over this many fresh boundary angles w ~ P(z,.) per H^3 factor (the Poisson kernel as its own proposal, unit weights; exact gradient), every forward in train and eval; null = the closed-form f_l(s) Y_lm(u), the best tested (M = 16 ties on sudoku and loses badly on TinyStories, M = 4 hurts); needs random_feature_type=sphere; adds no checkpoint keys
length: 1024
n_blocks: 12
n_heads: 12
dropout: 0.1
# Hyperbolic embedding initialization strategy:
#   random     – N(0, 0.02²) raw weights; original baseline
#   ngpt       – N(0, 1/d)   raw weights; nGPT convention
#   hyperbolic – N(0, 0.3²)  raw weights; ‖e_v‖≈0.3·√d so the embedding radius
#                is the same order as E[ρ_prior] at init (length-as-radial)
#   pretrained – raw pretrained LM embeddings (call
#                backbone.init_sphere_embed_from_pretrained() after construction)
init: ngpt             # random: std=0.02, hyperbolic: std=0.3 ⇒ ‖e_v‖≈6.8 at init
init_std: null               # std for init=custom; ignored for other init modes
learn_temperature_scaling: False
eps: 1e-6
# Optional: path to an AR or DUO Lightning checkpoint. When set, HyperbolicDiT
# adapts the source weights on the fly at construction time (strips the
# "backbone." prefix, renames vocab_embed.embedding -> sphere_embed.weight,
# copies shape-matching params; the rest keep their fresh-init values).
pretrained_ckpt_path: null
