predictor: eflm
steps: 1024
noise_removal: ancestral  # 'ancestral' (sample) or 'greedy' (argmax) at the final step
velocity: exact           # exact (expected v = p@E - x) / sample (one sampled target)
use_float64: true
p_nucleus: 1.0
top_k: -1
top_k_velocity: -1        # top-k for velocity computation (-1 = use all vocab)
eta: 0.0                  # SDE noise scale; 0 = deterministic ODE (experiments/eflm_sde/derivation.md)
gt_method: linear         # SDE diffusion scale g(t): const / sqrt / linear / quad = (1-t)^{0, 0.5, 1, 2}
temperature: 1.0
num_sample_batches: 2
num_sample_log: 2
